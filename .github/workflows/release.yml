name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v5.0.0)'
        required: false
        default: 'v5.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Standalone Executable via Wails
        run: wails build

      - name: Compile NSIS Setup Installer
        run: |
          $makensis = if (Get-Command makensis -ErrorAction SilentlyContinue) { "makensis" } else { "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis /DARG_WAILS_AMD64_BINARY=..\..\bin\EasyWinGet.exe build\windows\installer\project.nsi

      - name: Package Portable Edition ZIP
        run: |
          $portableDir = "build\bin\EasyWinGet-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$portableDir\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portableDir\downloads" | Out-Null
          Copy-Item "build\bin\EasyWinGet.exe" -Destination "$portableDir\EasyWinGet.exe" -Force
          New-Item -ItemType File -Force -Path "$portableDir\portable" | Out-Null
          Compress-Archive -Path "$portableDir\*" -DestinationPath "build\bin\EasyWinGet-portable.zip" -Force

      - name: Package Standalone ZIP
        run: |
          Compress-Archive -Path "build\bin\EasyWinGet.exe" -DestinationPath "build\bin\EasyWinGet-standalone.zip" -Force

      - name: Compute SHA-256 Checksums
        working-directory: build/bin
        run: |
          Get-FileHash -Algorithm SHA256 "EasyWinGet-amd64-installer.exe", "EasyWinGet-portable.zip", "EasyWinGet-standalone.zip", "EasyWinGet.exe" | 
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | 
            Out-File -Encoding utf8 "checksums-sha256.txt"
          Get-Content "checksums-sha256.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: EasyWinGet ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            build/bin/EasyWinGet-amd64-installer.exe
            build/bin/EasyWinGet-portable.zip
            build/bin/EasyWinGet-standalone.zip
            build/bin/EasyWinGet.exe
            build/bin/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
