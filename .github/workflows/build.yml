name: Build and Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Binary & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Standalone Executable via Wails
        run: wails build

      - name: Compile NSIS Setup Installer
        run: |
          $makensis = if (Get-Command makensis -ErrorAction SilentlyContinue) { "makensis" } else { "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis /DARG_WAILS_AMD64_BINARY=..\..\bin\EasyWinGet.exe build\windows\installer\project.nsi

      - name: Package Release Executables
        run: |
          Copy-Item "build\bin\EasyWinGet-amd64-installer.exe" -Destination "build\bin\EasyWinGet-setup.exe" -Force
          Copy-Item "build\bin\EasyWinGet.exe" -Destination "build\bin\EasyWinGet-standalone.exe" -Force
          Copy-Item "build\bin\EasyWinGet.exe" -Destination "build\bin\EasyWinGet-portable.exe" -Force

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyWinGet-Setup
          path: build/bin/EasyWinGet-setup.exe
          if-no-files-found: error

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyWinGet-Portable
          path: build/bin/EasyWinGet-portable.exe
          if-no-files-found: error

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyWinGet-Standalone
          path: build/bin/EasyWinGet-standalone.exe
          if-no-files-found: error

